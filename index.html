<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no">
<title>__APP_NAME__</title>
<script src="https://telegram.org/js/telegram-web-app.js"></script>
<style>
:root{
  --bg:#0a0e16;--card:#131a27;--card2:#1a2334;--line:#233049;--text:#e9eef8;--sub:#8794ac;
  --acc:#4f8cff;--acc2:#8a5cff;--ok:#2fd39a;--warn:#ffb327;--bad:#ff5c6c;--r:18px;
}
[data-theme=light]{--bg:#f3f5fa;--card:#ffffff;--card2:#eef1f8;--line:#dfe5f1;--text:#101828;--sub:#667085}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;background:var(--bg);color:var(--text);font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif;font-size:15px}
body{min-height:100vh;padding-bottom:calc(84px + env(safe-area-inset-bottom))}
.app{max-width:540px;margin:0 auto;padding:14px 16px}
h2{margin:6px 0 12px;font-size:20px}h3{margin:0 0 6px;font-size:17px}
p{margin:0 0 10px;color:var(--sub);line-height:1.45}
.sub{color:var(--sub);font-size:13px}
.card{background:var(--card);border:1px solid var(--line);border-radius:var(--r);padding:16px;margin-bottom:12px}
.row{display:flex;align-items:center;gap:10px}.sp{flex:1;min-width:0}
.grid3{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-top:14px}
.mini{background:var(--card2);border-radius:14px;padding:10px 8px;text-align:center}
.mini b{display:block;font-size:15px}.mini span{font-size:11px;color:var(--sub)}
.hero{background:linear-gradient(135deg,#1c3b8f,#5b3bd1);border:0;color:#fff}
.hero .sub{color:#d3dcff}.hero .mini{background:rgba(255,255,255,.14)}.hero .mini span{color:#dbe3ff}
.big{font-size:34px;font-weight:800;letter-spacing:-.5px;margin:2px 0}
.banner{display:flex;align-items:center;gap:12px;padding:14px 16px;border-radius:var(--r);margin-bottom:12px;
  background:linear-gradient(120deg,#ffb327,#ff7a3d);color:#2a1600;cursor:pointer}
.banner.on{background:linear-gradient(120deg,#1f7a5c,#2fd39a);color:#052a1d}
.banner b{display:block;font-size:15px}.banner small{opacity:.85}
.banner .go{margin-left:auto;background:rgba(0,0,0,.18);padding:8px 12px;border-radius:12px;font-weight:700;font-size:13px;white-space:nowrap}
.warnbox{background:rgba(255,179,39,.12);border:1px solid rgba(255,179,39,.4);color:var(--text)}
.badbox{background:rgba(255,92,108,.12);border:1px solid rgba(255,92,108,.45)}
.btn{appearance:none;border:0;border-radius:14px;padding:13px 16px;font-size:15px;font-weight:700;color:#fff;cursor:pointer;
  background:linear-gradient(135deg,var(--acc),var(--acc2));width:100%}
.btn.sm{width:auto;padding:9px 14px;font-size:13px;border-radius:12px}
.btn.ghost{background:var(--card2);color:var(--text)}
.btn.ok{background:var(--ok);color:#042a1d}.btn.bad{background:var(--bad)}
.btn:disabled{opacity:.5}.btn:active{transform:scale(.98)}
.chip{display:inline-block;padding:3px 9px;border-radius:99px;font-size:11px;font-weight:700;background:var(--card2);color:var(--sub)}
.chip.g{background:rgba(47,211,154,.16);color:var(--ok)}.chip.y{background:rgba(255,179,39,.16);color:var(--warn)}
.chip.r{background:rgba(255,92,108,.16);color:var(--bad)}.chip.b{background:rgba(79,140,255,.16);color:var(--acc)}
.item{display:flex;align-items:center;gap:12px;padding:12px 0;border-bottom:1px solid var(--line)}
.item:last-child{border-bottom:0}
.ico{width:42px;height:42px;border-radius:13px;background:var(--card2);display:grid;place-items:center;font-size:19px;flex:none}
.item b{display:block;font-size:14.5px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.pos{color:var(--ok);font-weight:700}.neg{color:var(--bad);font-weight:700}
.seg{display:flex;background:var(--card2);border-radius:14px;padding:4px;margin-bottom:12px}
.seg button{flex:1;border:0;background:none;color:var(--sub);font-weight:700;padding:9px;border-radius:11px;font-size:14px}
.seg button.on{background:var(--card);color:var(--text);box-shadow:0 1px 6px rgba(0,0,0,.25)}
input,textarea{width:100%;background:var(--card2);border:1px solid var(--line);color:var(--text);border-radius:13px;padding:13px;font-size:15px;margin:4px 0 8px;outline:none}
input:focus{border-color:var(--acc)}
.swrow{display:flex;align-items:center;justify-content:space-between;gap:12px;margin:10px 0;padding:12px 14px;border-radius:13px;background:var(--card2);cursor:pointer}
.swrow b{color:var(--text);font-size:14px}.swrow .sub{display:block;margin-top:2px}
.swrow input{-webkit-appearance:none;appearance:none;width:46px;height:26px;min-width:46px;margin:0;padding:0;border-radius:99px;background:var(--line);border:0;position:relative;transition:.2s;cursor:pointer}
.swrow input:after{content:'';position:absolute;top:3px;left:3px;width:20px;height:20px;border-radius:50%;background:#fff;transition:.2s}
.swrow input:checked{background:var(--ok)}.swrow input:checked:after{left:23px}
.ins{white-space:pre-wrap;word-break:break-word;background:var(--card2);border-left:3px solid var(--acc);border-radius:10px;padding:10px 12px;margin:0 0 12px;color:var(--text);font-size:14px;line-height:1.45}
.ins small{display:block;color:var(--sub);font-weight:700;margin-bottom:4px}
label{font-size:12px;color:var(--sub);font-weight:600}
.qs{display:flex;gap:8px;margin:2px 0 10px;flex-wrap:wrap}
.qs button{border:1px solid var(--line);background:var(--card2);color:var(--text);padding:7px 12px;border-radius:99px;font-size:13px}
.empty{text-align:center;color:var(--sub);padding:26px 10px}
.empty i{display:block;font-size:34px;font-style:normal;margin-bottom:6px}
.avatar{width:84px;height:84px;border-radius:50%;margin:0 auto 10px;display:grid;place-items:center;font-size:34px;font-weight:800;
  background:linear-gradient(135deg,var(--acc),var(--acc2));color:#fff;overflow:hidden}
.avatar img{width:100%;height:100%;object-fit:cover}
.kv{display:flex;justify-content:space-between;gap:10px;padding:11px 0;border-bottom:1px solid var(--line)}
.kv:last-child{border-bottom:0}.kv span{color:var(--sub)}.kv b{text-align:right;word-break:break-all}
.link{color:var(--acc);font-weight:700;cursor:pointer}
/* nav */
nav{position:fixed;left:0;right:0;bottom:0;z-index:20;background:var(--card);border-top:1px solid var(--line);
  display:flex;padding:6px 6px calc(6px + env(safe-area-inset-bottom))}
nav button{flex:1;border:0;background:none;color:var(--sub);display:flex;flex-direction:column;align-items:center;gap:3px;
  font-size:11px;font-weight:700;padding:6px 0;position:relative}
nav button.on{color:var(--acc)}
.payfab{position:fixed;right:14px;bottom:calc(76px + env(safe-area-inset-bottom));z-index:19;border:0;border-radius:99px;padding:11px 16px;font-weight:800;font-size:13px;color:#fff;
  background:linear-gradient(135deg,var(--ok),var(--acc));box-shadow:0 6px 18px rgba(0,0,0,.35);display:flex;align-items:center;gap:6px;cursor:pointer}
.payfab[hidden]{display:none}
nav svg{width:24px;height:24px;fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
.dot{position:absolute;top:2px;right:28%;width:9px;height:9px;border-radius:50%;background:var(--bad)}
/* sheet + modal */
#sheet{position:fixed;inset:0;z-index:55;display:none}
#sheet.open{display:block}
#sheet .bd{position:absolute;inset:0;background:rgba(0,0,0,.55)}
#sheet .pn{position:absolute;left:0;right:0;bottom:0;max-height:90vh;overflow:auto;background:var(--bg);border-radius:24px 24px 0 0;
  padding:10px 16px calc(24px + env(safe-area-inset-bottom));max-width:540px;margin:0 auto;animation:up .22s ease}
#sheet .gr{width:44px;height:5px;border-radius:9px;background:var(--line);margin:4px auto 14px}
@keyframes up{from{transform:translateY(40px);opacity:0}to{transform:none;opacity:1}}
#modal{position:fixed;inset:0;z-index:60;background:rgba(0,0,0,.6);display:none;place-items:center;padding:24px}
#modal.open{display:grid}
.mbox{background:var(--card);border:1px solid var(--line);border-radius:22px;padding:24px 20px 18px;max-width:340px;width:100%;text-align:center;animation:pop .18s ease}
.mbox .mic{font-size:42px;margin-bottom:6px}.mbox p{white-space:pre-line}.sk{display:grid;grid-template-columns:repeat(7,1fr);gap:5px;margin:0 0 14px}.sk div{border:1px solid var(--line);border-radius:10px;padding:6px 0;font-size:11px;line-height:1.3}.sk div b{display:block;font-size:13px}.sk .dn{background:rgba(52,199,89,.18);border-color:#34c759}.sk .nx{border-color:#ff9f0a;box-shadow:0 0 0 1px #ff9f0a inset}.mbox p{margin-bottom:16px}
@keyframes pop{from{transform:scale(.9);opacity:0}to{transform:none;opacity:1}}
#loader{position:fixed;inset:0;z-index:70;background:rgba(0,0,0,.35);display:none;place-items:center}
#loader.open{display:grid}
.spin{display:inline-block;width:22px;height:22px;border:3px solid var(--line);border-top-color:var(--acc);border-radius:50%;animation:sp .8s linear infinite;vertical-align:middle}
@keyframes sp{to{transform:rotate(360deg)}}
.qr{display:block;width:230px;height:230px;margin:10px auto;border-radius:16px;background:#fff;padding:10px;object-fit:contain}
.wait{text-align:center;color:var(--sub);margin-top:12px}
.tabs2{display:flex;gap:6px;margin-bottom:14px}
.tabs2 button{flex:1;border:1px solid var(--line);background:var(--card);color:var(--sub);padding:9px 4px;border-radius:12px;font-weight:700;font-size:13px}
.tabs2 button.on{background:var(--acc);border-color:var(--acc);color:#fff}
.steps{counter-reset:s;padding:0;margin:8px 0 14px;list-style:none}
.steps li{counter-increment:s;position:relative;padding-left:32px;margin-bottom:9px;color:var(--sub);line-height:1.45}
.steps li b{color:var(--text)}
.steps li:before{content:counter(s);position:absolute;left:0;top:0;width:22px;height:22px;border-radius:50%;background:var(--card2);color:var(--text);font-size:12px;font-weight:700;display:grid;place-items:center}
.sp>b{display:block}.sp>.sub{display:block;margin-top:2px}
.prev{max-width:100%;max-height:200px;border-radius:12px;margin:6px 0;display:block}
.cost{background:var(--card2);border-radius:13px;padding:11px 13px;margin:2px 0 12px;font-size:14px}
#chat{position:fixed;inset:0;z-index:50;background:var(--bg);display:none;flex-direction:column}
#chat.open{display:flex}
#prem{position:fixed;inset:0;z-index:30;background:var(--bg);display:none;overflow:auto;-webkit-overflow-scrolling:touch}
#prem.open{display:block}
.pm-in{max-width:540px;margin:0 auto;padding:0 14px calc(28px + env(safe-area-inset-bottom))}
.pm-h{position:sticky;top:0;z-index:2;display:flex;align-items:center;gap:10px;padding:12px 0;background:var(--bg)}
.pm-h button{border:0;background:var(--card2);color:var(--text);width:36px;height:36px;border-radius:12px;font-size:22px;line-height:1}
.pm-h b{font-size:18px}
.pm-st{border:1px solid var(--line);background:var(--card);border-radius:16px;padding:12px 14px;margin-bottom:14px;font-size:14px}
.pm-card{position:relative;border-radius:22px;padding:20px 18px 18px;margin-bottom:16px;color:#fff;overflow:hidden;box-shadow:0 10px 26px rgba(0,0,0,.35)}
.pm-card:before{content:"";position:absolute;right:-40px;top:-40px;width:160px;height:160px;border-radius:50%;background:rgba(255,255,255,.14)}
.pm-card:after{content:"";position:absolute;left:-50px;bottom:-60px;width:150px;height:150px;border-radius:50%;background:rgba(255,255,255,.08)}
.pm-card>*{position:relative;z-index:1}
.pm-tag{display:inline-block;font-size:11px;font-weight:800;letter-spacing:.6px;padding:4px 10px;border-radius:99px;background:rgba(255,255,255,.22);margin-bottom:8px}
.pm-top{display:flex;align-items:flex-end;justify-content:space-between;gap:8px}
.pm-lv{font-size:13px;font-weight:800;opacity:.9;letter-spacing:.8px;text-transform:uppercase}
.pm-price{font-size:42px;font-weight:900;line-height:1}
.pm-price small{font-size:13px;font-weight:700;opacity:.85;margin-left:4px}
.pm-feat{list-style:none;margin:14px 0 14px;padding:0}
.pm-feat li{padding:5px 0 5px 24px;position:relative;font-size:14px;line-height:1.35}
.pm-feat li:before{content:"✓";position:absolute;left:0;top:5px;width:18px;height:18px;border-radius:50%;background:rgba(255,255,255,.25);font-size:11px;font-weight:900;display:grid;place-items:center}
.pm-btns{display:flex;gap:8px}
.pm-btns button{flex:1;border:0;border-radius:14px;padding:13px 6px;font-weight:800;font-size:14px;cursor:pointer;background:#fff;color:#111}
.pm-btns button.alt{background:rgba(0,0,0,.28);color:#fff}
.pm-free{font-size:12.5px;color:var(--sub);text-align:center;margin:4px 6px 0;line-height:1.5}
.ch-h{display:flex;align-items:center;gap:10px;padding:12px 14px;border-bottom:1px solid var(--line);background:var(--card)}
.ch-h button{border:0;background:var(--card2);color:var(--text);width:36px;height:36px;border-radius:12px;font-size:22px;line-height:1}
.ch-h b{font-size:16px}.ch-h span{display:block;font-size:12px;color:var(--sub);font-weight:400}
#chatBody{flex:1;overflow:auto;padding:14px 14px 6px;max-width:540px;width:100%;margin:0 auto}
.ch-f{display:flex;gap:8px;padding:10px 12px calc(10px + env(safe-area-inset-bottom));border-top:1px solid var(--line);background:var(--card)}
.ch-f input{margin:0;flex:1}
.b{max-width:82%;padding:10px 13px;border-radius:18px;margin:6px 0;line-height:1.4;word-break:break-word;white-space:pre-wrap;width:fit-content}
.b small{display:block;opacity:.65;font-size:10px;margin-top:4px;white-space:normal}
.b.me{margin-left:auto;background:linear-gradient(135deg,var(--acc),var(--acc2));color:#fff;border-bottom-right-radius:5px}
.b.them{background:var(--card2);border-bottom-left-radius:5px}

/* ---- splash / loader / gate ---- */
#splash{position:fixed;inset:0;z-index:100;display:flex;align-items:center;justify-content:center;overflow:hidden;color:#fff;
  background:radial-gradient(120% 80% at 50% -10%,#3a4fd6 0%,#1a1f5e 38%,#0a0e16 75%);transition:opacity .5s ease,visibility .5s}
#splash.hide{opacity:0;visibility:hidden}
.sp-card{position:relative;z-index:2;text-align:center;padding:0 28px;width:100%;max-width:360px}
.sp-banner{border-radius:26px;padding:30px 20px 24px;background:linear-gradient(135deg,rgba(255,255,255,.16),rgba(255,255,255,.05));
  border:1px solid rgba(255,255,255,.22);box-shadow:0 24px 70px rgba(0,0,0,.45);backdrop-filter:blur(8px);animation:rise .7s ease both}
.coin3d{width:96px;height:96px;margin:0 auto 14px;border-radius:50%;display:grid;place-items:center;font-size:46px;font-weight:800;color:#7a4300;
  background:radial-gradient(circle at 30% 26%,#fff0b8,#ffc233 52%,#d98200);box-shadow:0 14px 44px rgba(255,179,39,.5),inset 0 -8px 14px rgba(0,0,0,.2);
  animation:wob 1.7s ease-in-out infinite;position:relative}
.coin3d:after{content:"";position:absolute;inset:-9px;border-radius:50%;border:2px solid rgba(255,214,102,.55);animation:ringp 1.7s ease-out infinite}
.sp-brand{font-size:34px;font-weight:800;letter-spacing:.5px;background:linear-gradient(90deg,#fff 20%,#ffe08a 45%,#fff 70%);background-size:220% 100%;
  -webkit-background-clip:text;background-clip:text;-webkit-text-fill-color:transparent;animation:shine 2.2s linear infinite}
.sp-tag{margin:6px 0 18px;font-size:13px;letter-spacing:2px;text-transform:uppercase;color:#cdd6ff}
.sp-bar{height:5px;border-radius:9px;background:rgba(255,255,255,.18);overflow:hidden}
.sp-bar i{display:block;height:100%;width:40%;border-radius:9px;background:linear-gradient(90deg,#ffb327,#ffe08a);animation:bar 1.3s ease-in-out infinite}
.sp-hint{margin-top:12px;font-size:12.5px;color:#cdd6ff;min-height:16px}
.fc{position:absolute;bottom:-30px;width:14px;height:14px;border-radius:50%;background:radial-gradient(circle at 30% 30%,#fff0b8,#ffb327);opacity:0;animation:floatup 5s linear infinite}
@keyframes wob{0%,100%{transform:rotateY(-28deg) translateY(0)}50%{transform:rotateY(28deg) translateY(-8px)}}
@keyframes ringp{0%{transform:scale(.92);opacity:.9}100%{transform:scale(1.35);opacity:0}}
@keyframes shine{to{background-position:-220% 0}}
@keyframes bar{0%{margin-left:-40%}100%{margin-left:100%}}
@keyframes rise{from{transform:translateY(24px);opacity:0}to{transform:none;opacity:1}}
@keyframes floatup{0%{transform:translateY(0) scale(.6);opacity:0}15%{opacity:.9}100%{transform:translateY(-110vh) scale(1.1);opacity:0}}
#loader{background:rgba(5,8,15,.55);backdrop-filter:blur(3px);-webkit-backdrop-filter:blur(3px)}
.lcard{display:flex;flex-direction:column;align-items:center;gap:12px;padding:22px 30px;border-radius:22px;background:var(--card);
  border:1px solid var(--line);box-shadow:0 20px 60px rgba(0,0,0,.45);animation:pop .18s ease}
.lcard span{font-size:13px;color:var(--sub);font-weight:600}
.lring{width:46px;height:46px;border-radius:50%;border:4px solid rgba(79,140,255,.18);border-top-color:var(--acc);border-right-color:var(--acc2);
  animation:sp .8s linear infinite;position:relative}
.lring:after{content:"";position:absolute;inset:9px;border-radius:50%;background:radial-gradient(circle at 30% 30%,#fff0b8,#ffb327);animation:pulse 1.2s ease-in-out infinite}
@keyframes pulse{0%,100%{transform:scale(.7);opacity:.7}50%{transform:scale(1);opacity:1}}
.gate{text-align:center;padding-top:8px}
.gate .gi{width:78px;height:78px;border-radius:24px;margin:10px auto 12px;display:grid;place-items:center;font-size:38px;
  background:linear-gradient(135deg,var(--acc),var(--acc2));box-shadow:0 12px 34px rgba(79,140,255,.35)}
.gate .steps{text-align:left;max-width:360px;margin:12px auto}
.banner button.go{border:0;color:inherit;font-family:inherit;cursor:pointer}
@media (prefers-reduced-motion:reduce){.coin3d,.coin3d:after,.sp-brand,.sp-bar i,.fc,.lring,.lring:after{animation:none}}
.ch-h .sp b{display:block;font-size:16px}
.cimg{display:block;max-width:100%;max-height:260px;border-radius:12px;margin-bottom:4px;background:var(--card2);min-width:90px;min-height:60px}
#chatPrev{display:none;padding:8px 14px;background:var(--card);border-top:1px solid var(--line)}
#chatPrev.on{display:flex;align-items:center;gap:10px}
#chatPrev img{height:54px;border-radius:10px}
.ch-f .btn.sm{flex:none}
.cimg{cursor:zoom-in}
#zoom{position:fixed;inset:0;z-index:70;background:rgba(0,0,0,.94);display:none;overflow:hidden;touch-action:none;user-select:none;-webkit-user-select:none}
#zoom.open{display:block}
#zoom img{position:absolute;left:50%;top:50%;max-width:100vw;max-height:100vh;transform-origin:0 0;will-change:transform}
#zoom .zx{position:absolute;top:calc(12px + env(safe-area-inset-top));right:14px;z-index:2;width:42px;height:42px;border-radius:50%;border:0;background:rgba(255,255,255,.16);color:#fff;font-size:20px;cursor:pointer}
#zoom .zh{position:absolute;bottom:calc(14px + env(safe-area-inset-bottom));left:0;right:0;text-align:center;color:#ffffff99;font-size:12px;pointer-events:none}
.vmsg{display:block;width:230px;max-width:100%;height:38px;margin-bottom:4px}
#recBar{display:none;align-items:center}
#recBar.on{display:flex}
.rdot{width:12px;height:12px;border-radius:50%;background:#ff3b4e;animation:rblink 1s ease-in-out infinite;flex:none}
@keyframes rblink{50%{opacity:.25}}
#adm{position:fixed;inset:0;z-index:35;background:var(--bg);display:none;overflow:auto;-webkit-overflow-scrolling:touch}
#adm.open{display:block}
.adm-in{max-width:560px;margin:0 auto;padding:0 16px calc(30px + env(safe-area-inset-bottom))}
.adm-t{display:flex;gap:6px;overflow-x:auto;padding:4px 0 12px;position:sticky;top:48px;z-index:2;background:var(--bg);scrollbar-width:none}
.adm-t::-webkit-scrollbar{display:none}
.adm-t button{flex:none;border:0;background:var(--card2);color:var(--sub);font-weight:700;font-size:13px;padding:9px 13px;border-radius:99px;white-space:nowrap}
.adm-t button.on{background:var(--acc);color:#fff}
.adm-t button i{font-style:normal;background:var(--bad);color:#fff;border-radius:99px;padding:1px 6px;font-size:11px;margin-left:4px}
.adm-g{display:grid;grid-template-columns:repeat(2,1fr);gap:10px}
.adm-g .mini{padding:14px 8px}.adm-g .mini b{font-size:19px}
.adm-r{display:flex;gap:8px;margin-top:10px}.adm-r .btn{flex:1;padding:10px;font-size:13px}
.adm-s{display:flex;gap:8px}.adm-s input{margin:0}

<body>
<div id="splash"><i class="fc" style="left:10%;animation-delay:0s"></i><i class="fc" style="left:26%;animation-delay:1.4s"></i><i class="fc" style="left:44%;animation-delay:.6s"></i><i class="fc" style="left:63%;animation-delay:2.2s"></i><i class="fc" style="left:80%;animation-delay:.9s"></i><i class="fc" style="left:92%;animation-delay:1.8s"></i>
<div class="sp-card"><div class="sp-banner"><div class="coin3d">₹</div><div class="sp-brand">__APP_NAME__</div><div class="sp-tag">Join · Earn · Withdraw</div><div class="sp-bar"><i></i></div><div class="sp-hint" id="spHint">Secure connection...</div></div></div></div>
<div class="app" id="view"></div>
<nav id="nav"></nav>
<button id="payfab" class="payfab" data-act="openpay" hidden>📢 <span>Payout Proofs</span></button>
<div id="sheet"><div class="bd" data-act="closesheet"></div><div class="pn"><div class="gr"></div><div id="sheetBody"></div></div></div>
<div id="modal"></div>
<div id="zoom"><button class="zx" data-act="zclose" aria-label="Close">✕</button><img alt=""><div class="zh">Pinch / double-tap se zoom</div></div>
<div id="loader"><div class="lcard"><div class="lring"></div><span>Please wait...</span></div></div>
<div id="chat"><div class="ch-h"><button data-act="chatclose" aria-label="Back">‹</button><div class="sp"><b id="chTitle">Customer service</b><span id="chSub">Apni problem likho, hum reply karenge</span></div></div>
<div id="chatBody"></div><div id="chatPrev"></div><div class="ch-f" id="chatFoot"><button class="btn sm ghost" data-act="chatpick" aria-label="Photo">📷</button><button class="btn sm ghost" data-act="recstart" aria-label="Voice" id="micBtn">🎤</button><input id="chatFile" type="file" accept="image/*" hidden><input id="chatIn" placeholder="Apni problem likho..." maxlength="1000" autocomplete="off"><button class="btn sm" data-act="chatsend">Send</button></div>
<div class="ch-f" id="recBar"><span class="rdot"></span><b id="recT">0:00</b><span class="sub sp">Recording... bolo</span><button class="btn sm ghost" data-act="reccancel" aria-label="Cancel">✕</button><button class="btn sm" data-act="recsend">Send 🎤</button></div></div>

<script>
const tg = window.Telegram && window.Telegram.WebApp;
if (tg) { tg.ready(); tg.expand(); try { tg.setHeaderColor('secondary_bg_color'); } catch (e) {} }
document.documentElement.dataset.theme = (tg && tg.colorScheme === 'light') ? 'light' : 'dark';

const S = { tab: 'home', me: null, cfg: null, blocked: [], hist: [], tasks: null, wallet: null, seg: 'ch', poll: null, studioTab: 'ch' };
const $ = s => document.querySelector(s);
/* ---------- sound (WebAudio, koi file nahi) ---------- */
const Snd = (() => {
  let ctx = null, on = true;
  try { on = localStorage.getItem('snd') !== '0'; } catch (e) {}
  function ac() {
    try {
      if (!ctx) { const C = window.AudioContext || window.webkitAudioContext; if (C) ctx = new C(); }
      if (ctx && ctx.state === 'suspended') ctx.resume();
    } catch (e) { ctx = null; }
    return ctx;
  }
  function note(c, f, t, dur, vol, type) {
    const o = c.createOscillator(), g = c.createGain();
    o.type = type || 'sine'; o.frequency.value = f;
    g.gain.setValueAtTime(0.0001, t);
    g.gain.exponentialRampToValueAtTime(vol, t + 0.015);
    g.gain.exponentialRampToValueAtTime(0.0001, t + dur);
    o.connect(g); g.connect(c.destination); o.start(t); o.stop(t + dur + 0.05);
  }
  return {
    unlock: ac,
    isOn: () => on,
    set(v) { on = v; try { localStorage.setItem('snd', v ? '1' : '0'); } catch (e) {} },
    ok() { // meetha chime: C5 - E5 - G5, halka bell overtone
      if (!on) return; const c = ac(); if (!c) return; const t = c.currentTime;
      [[523.25, 0], [659.25, 0.1], [783.99, 0.2]].forEach(([f, d]) => { note(c, f, t + d, 0.5, 0.13); note(c, f * 2, t + d, 0.3, 0.035); });
    },
    bad() { // narm do-note descent, harsh nahi
      if (!on) return; const c = ac(); if (!c) return; const t = c.currentTime;
      note(c, 330, t, 0.22, 0.11, 'triangle'); note(c, 247, t + 0.14, 0.3, 0.11, 'triangle');
    },
    tap() { if (!on) return; const c = ac(); if (!c) return; note(c, 880, c.currentTime, 0.06, 0.04); }
  };
})();
document.addEventListener('pointerdown', () => Snd.unlock(), { once: true, passive: true });

/* ---------- device token (random, device par bandha) + fingerprint ---------- */
function tgStore(kind, op, key, val) {
  return new Promise(res => {
    try {
      const s = tg && tg[kind];
      if (!s || !tg.isVersionAtLeast || !tg.isVersionAtLeast('9.0')) return res(null);
      const to = setTimeout(() => res(null), 800);
      const cb = (e, v) => { clearTimeout(to); res(e ? null : (typeof v === 'string' ? v : null)); };
      if (op === 'get') s.getItem(key, cb); else s.setItem(key, val, cb);
    } catch (e) { res(null); }
  });
}
function ckGet(k) { const m = document.cookie.match(new RegExp('(?:^|; )' + k + '=([a-f0-9]{64})')); return m ? m[1] : null; }
function ckSet(k, v) { try { document.cookie = k + '=' + v + '; max-age=63072000; path=/; SameSite=Lax; Secure'; } catch (e) {} }
function idbOp(mode, key, val) { // IndexedDB me bhi ek copy (localStorage saaf ho to bhi bachi rahe)
  return new Promise(res => {
    try {
      const rq = indexedDB.open('dvdb', 1);
      rq.onupgradeneeded = () => rq.result.createObjectStore('k');
      rq.onerror = () => res(null);
      rq.onsuccess = () => {
        try {
          const tx = rq.result.transaction('k', mode === 'set' ? 'readwrite' : 'readonly'), st = tx.objectStore('k');
          if (mode === 'set') { st.put(val, key); tx.oncomplete = () => res(true); tx.onerror = () => res(null); }
          else { const g = st.get(key); g.onsuccess = () => res(g.result || null); g.onerror = () => res(null); }
        } catch (e) { res(null); }
      };
    } catch (e) { res(null); }
  });
}
async function devToken() {
  if (S.dev) return S.dev;
  if (S.devP) return S.devP;
  S.devP = (async () => {
    const key = 'dvt1', ok64 = v => v && /^[a-f0-9]{64}$/.test(v);
    let ls = null; try { ls = localStorage.getItem(key); } catch (e) {}
    const sync = t => { // token ko saari jagah likho (jo saaf ho gayi wo wapas bhar jaye)
      try { localStorage.setItem(key, t); } catch (e) {}
      ckSet(key, t); idbOp('set', key, t); tgStore('SecureStorage', 'set', key, t); tgStore('DeviceStorage', 'set', key, t);
    };
    if (ok64(ls)) { S.dev = ls; sync(ls); return ls; } // fast path
    const [ss, ds, ix] = await Promise.all([tgStore('SecureStorage', 'get', key), tgStore('DeviceStorage', 'get', key), idbOp('get', key)]);
    let t = [ckGet(key), ix, ss, ds].find(ok64);
    if (!t) { const a = new Uint8Array(32); crypto.getRandomValues(a); t = [...a].map(v => v.toString(16).padStart(2, '0')).join(''); }
    sync(t);
    return (S.dev = t);
  })();
  return S.devP;
}
async function getFp() { return S.fp || (S.fp = await fingerprint()); }

const esc = s => String(s == null ? '' : s).replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
const fmt = n => Number(n || 0).toLocaleString('en-IN');
const inr = c => (c / (S.cfg ? S.cfg.coin_per_inr : 100)).toLocaleString('en-IN', { minimumFractionDigits: 2, maximumFractionDigits: 2 });
const when = iso => iso ? new Date(iso).toLocaleString('en-IN', { day: 'numeric', month: 'short', hour: '2-digit', minute: '2-digit' }) : '';
const dateOnly = iso => iso ? new Date(iso).toLocaleDateString('en-IN', { day: 'numeric', month: 'short', year: 'numeric' }) : '';

/* ---------- network ---------- */
async function api(path, data, form) {
  const opt = { headers: { 'X-Init-Data': (tg && tg.initData) || '', 'X-Device': await devToken(), 'X-Fp': await getFp() } };
  if (form) { opt.method = 'POST'; opt.body = form; }
  else if (data !== undefined) { opt.method = 'POST'; opt.headers['Content-Type'] = 'application/json'; opt.body = JSON.stringify(data); }
  try { const r = await fetch(path, opt); const j = await r.json(); if (j && j.code === 'need_join' && S.me && !S.me.need_join && !S.me.admin) { S.me.need_join = true; setTimeout(refresh, 50); } return j; }
  catch (e) { return { ok: false, msg: 'Network error. Dobara try karo.' }; }
}
async function act(path, data, form) {
  $('#loader').classList.add('open');
  const j = await api(path, data, form);
  $('#loader').classList.remove('open');
  if (!j.ok) {
    if (j.code === 'need_verify' || j.code === 'need_join') { if (j.code === 'need_join' && S.me) S.me.need_join = true; refresh(); return j; }
    await popup('error', 'Oops', j.msg || 'Kuch galat ho gaya');
  }
  return j;
}

/* ---------- popup / sheet ---------- */
function popup(kind, title, msg) {
  return new Promise(res => {
    const m = $('#modal');
    const icon = { ok: '✅', error: '⚠️', info: 'ℹ️' }[kind] || 'ℹ️';
    const clean = String(msg || '').replace(/^[✅❌⏳🚫🔐⚠️ℹ️\s]+/u, '');
    m.innerHTML = `<div class="mbox"><div class="mic">${icon}</div><h3>${esc(title)}</h3><p>${esc(clean)}</p><button class="btn ${kind === 'error' ? 'ghost' : ''}" id="mok">OK</button></div>`;
    m.classList.add('open');
    $('#mok').onclick = () => { m.classList.remove('open'); res(); };
    try { tg && tg.HapticFeedback.notificationOccurred(kind === 'ok' ? 'success' : kind === 'error' ? 'error' : 'warning'); } catch (e) {}
    if (kind === 'ok') Snd.ok(); else if (kind === 'error') Snd.bad();
  });
}
function openSheet(html) { $('#sheetBody').innerHTML = html; $('#sheet').classList.add('open'); document.body.style.overflow = 'hidden'; }
function closeSheet() {
  clearInterval(S.poll); $('#sheet').classList.remove('open'); document.body.style.overflow = '';
  if (S.payOpen) { S.payOpen = false; if (S.me && S.me.active && (S.tab === 'home' || S.tab === 'wallet')) ({ home: rHome, wallet: rWallet })[S.tab](); }
}
function openLink(u) {
  if (!u) return;
  if (tg && /^https?:\/\/t\.me\//.test(u)) tg.openTelegramLink(u);
  else if (tg && /^https?:/.test(u)) tg.openLink(u);
  else window.location.href = u;
}

/* ---------- icons ---------- */
const IC = {
  home: '<svg viewBox="0 0 24 24"><path d="M3 11l9-8 9 8v9a1 1 0 0 1-1 1h-5v-6H9v6H4a1 1 0 0 1-1-1z"/></svg>',
  tasks: '<svg viewBox="0 0 24 24"><path d="M9 6h11M9 12h11M9 18h11M4 6l1 1 2-2M4 12l1 1 2-2M4 18l1 1 2-2"/></svg>',
  wallet: '<svg viewBox="0 0 24 24"><path d="M3 8a2 2 0 0 1 2-2h13v3"/><rect x="3" y="8" width="18" height="12" rx="2"/><circle cx="16.5" cy="14" r="1.2"/></svg>',
  profile: '<svg viewBox="0 0 24 24"><circle cx="12" cy="8" r="4"/><path d="M4 21c0-4 4-6 8-6s8 2 8 6"/></svg>'
};
function renderNav() {
  const t = [['home', 'Home'], ['tasks', 'Tasks'], ['wallet', 'Wallet'], ['profile', 'Profile']];
  $('#nav').innerHTML = t.map(([k, l]) => `<button class="${S.tab === k ? 'on' : ''}" data-act="go" data-tab="${k}">${IC[k]}<span>${l}</span>${k === 'tasks' && S.blocked.length ? '<i class="dot"></i>' : ''}${k === 'profile' && S.me && !S.me.device_ok ? '<i class="dot"></i>' : ''}</button>`).join('');
}

/* ---------- data ---------- */
function skRow(day, st) {
  let h = '';
  for (let i = 1; i <= st.days; i++) h += `<div class="${i <= day ? 'dn' : i === day + 1 ? 'nx' : ''}"><span data-nt="1">D${i}</span><b data-nt="1">+${i * st.step}</b></div>`;
  return `<div class="sk">${h}</div>`;
}
async function streakPop() {
  const st = S.me && S.me.streak;
  if (!st || !st.show || S.skShown || !S.me.lang_set || S.me.need_join) return;
  S.skShown = true;
  api('/api/streak/seen', {});
  const m = $('#modal');
  m.innerHTML = `<div class="mbox"><div class="mic">🔥</div><h3>Daily Streak</h3><p>${st.done ? 'Aaj ka streak complete ho gaya! Kal phir aana.' : 'Aaj kam se kam 1 task complete karo aur streak coins pao.'}</p>${skRow(st.day, st)}<button class="btn" id="mok">OK</button></div>`;
  m.classList.add('open');
  if (window.applyLang) applyLang();
  $('#mok').onclick = () => m.classList.remove('open');
}
async function loadMe() {
  const j = await api('/api/me');
  if (!j.ok) { $('#view').innerHTML = `<div class="card empty"><i>⚠️</i>${esc(j.msg || 'Error')}<br><br><button class="btn" data-act="reload">Retry</button></div>`; return false; }
  S.me = j.me; if (S.me.active) S.me.active.t0 = Date.now(); S.cfg = j.cfg; S.blocked = j.blocked; S.hist = j.history; if (window.applyLang) applyLang(); setTimeout(streakPop, 600); return true;
}
let goSeq = 0;
async function go(tab) {
  const my = ++goSeq, L = $('#loader');
  S.tab = tab; renderNav();
  window.scrollTo(0, 0);
  L.classList.add('open'); // baaki sab loading jaisa hi popup loader
  try {
    const extra = tab === 'tasks' ? api('/api/tasks') : tab === 'wallet' ? api('/api/wallet') : Promise.resolve(null);
    const [okMe, j] = await Promise.all([loadMe(), extra]); // parallel: tab jaldi khulta hai
    if (my !== goSeq) return; // beech me dusra tab khul gaya
    if (!okMe) return;
    if (S.me.need_join && !S.me.admin) { rJoin(); return; }
    if (!S.me.device_ok && !S.me.admin) { rGate(); return; }
    if (S.blocked.length && !S.me.admin) { rBlocked(); return; }
    $('#nav').style.display = '';
    if (j && j.ok) { if (tab === 'tasks') S.tasks = j; else S.wallet = j; }
    renderNav(); render();
  } finally { if (my === goSeq) L.classList.remove('open'); }
}
async function refresh() { await go(S.tab); }
function render() {
  ({ home: rHome, tasks: rTasks, wallet: rWallet, profile: rProfile })[S.tab]();
  const f = $('#payfab'); if (f) f.hidden = !(S.tab === 'wallet' && S.cfg && S.cfg.payout_link);
}

/* ---------- HOME ---------- */
const KIND = {
  hold: ['⏳', 'Join reward (hold)'], release: ['💰', 'Reward released'], revoke: ['🚫', 'Reward cut (channel left)'],
  admin_add: ['👑', 'Admin credit'], referral: ['🤝', 'Referral reward'], streak: ['🔥', 'Daily streak reward'], ref_bonus: ['🏆', 'Refer milestone bonus'], deposit: ['⬇️', 'Deposit'], premium: ['💎', 'Premium'], withdraw: ['⬆️', 'Withdraw'], withdraw_refund: ['↩️', 'Withdraw refund'],
  bw_reward: ['🤖', 'Bot work reward'], task_escrow: ['📣', 'Channel task created'], task_refund: ['↩️', 'Task refund'],
  bw_escrow: ['🤖', 'Bot work created'], debt_pay: ['⚖️', 'Purana leave hisaab kata'], bw_refund: ['↩️', 'Bot work refund'], gift: ['🎁', 'Gift code']
};
function deviceWarn() {
  return S.me.device_ok ? '' : `<div class="card warnbox"><div class="row"><div class="ico">🔐</div><div class="sp"><b>Device verify karo</b><div class="sub">Tasks aur withdraw ke liye zaroori hai</div></div><button class="btn sm" data-act="verify">Verify</button></div></div>`;
}
const LNAMES = { hn: 'Hinglish', hi: 'हिन्दी', en: 'English' };
function langBox() {
  const l = (S.me && S.me.lang) || 'en';
  const n = (S.me && S.me.news_unread) || 0;
  return `<div class="langbar"><button class="langbtn bell" data-act="news" aria-label="Notifications">🔔${n ? `<u>${n > 9 ? '9+' : n}</u>` : ''}</button><button class="langbtn" data-act="langpick" aria-label="Language">🌐 <b>${LNAMES[l]}</b> <i>▾</i></button></div>`;
}
function langGate() {
  const m = $('#modal');
  m.innerHTML = `<div class="mbox" data-nt="1"><div class="mic">🌐</div><h3>Choose your language</h3><p>अपनी भाषा चुनें · Apni bhasha chuno</p>${['en', 'hi', 'hn'].map(k => `<button class="btn ${k === 'en' ? '' : 'ghost'}" style="margin-top:8px" data-act="langset" data-l="${k}">${LNAMES[k]}</button>`).join('')}</div>`;
  m.classList.add('open');
}
function langSheet() {
  const l = (S.me && S.me.lang) || 'en';
  openSheet(`<h3>🌐 Language</h3>${['hn', 'hi', 'en'].map(k => `<button class="btn ${k === l ? '' : 'ghost'}" style="margin-bottom:8px" data-act="langset" data-l="${k}">${k === l ? '✓ ' : ''}${LNAMES[k]}</button>`).join('')}`);
}
function payBanner() {
  const a = S.me && S.me.active; if (!a) return '';
  const left = a.left - Math.floor((Date.now() - a.t0) / 1000);
  if (left <= 0) { S.me.active = null; return ''; }
  return `<div class="banner on" data-act="resumepay"><span style="font-size:26px">⏳</span><div><b>Payment pending</b><small>QR dobara dekhne ke liye tap karo</small><br><small class="nt" data-nt="1">${a.method === 'usdt' ? esc(a.pay_amount) + ' USDT' : '₹' + esc(a.pay_amount)} · <span id="pbt">${Math.floor(left / 60)}:${String(left % 60).padStart(2, '0')}</span></small></div><span class="go">QR</span></div>`;
}
setInterval(() => {
  const el = $('#pbt'); if (!el || !S.me || !S.me.active) return;
  const l = S.me.active.left - Math.floor((Date.now() - S.me.active.t0) / 1000);
  if (l <= 0) { S.me.active = null; const f = ({ home: rHome, wallet: rWallet })[S.tab]; if (f && !$('#sheet').classList.contains('open')) f(); return; }
  el.textContent = `${Math.floor(l / 60)}:${String(l % 60).padStart(2, '0')}`;
}, 1000);
function rHome() {
  const m = S.me;
  const banner = m.premium
    ? `<div class="banner on" data-act="prem"><span style="font-size:26px">${m.admin ? '👑' : '💎'}</span><div><b>${m.admin ? 'Admin · unlimited' : 'Premium Level ' + m.real_level}</b><small>${m.admin ? 'Tasks free, coins nahi katenge' : 'till ' + dateOnly(m.premium_until) + ' · tap = upgrade'}</small></div><span class="go">Plans</span></div>`
    : `<div class="banner" data-act="prem"><span style="font-size:26px">💎</span><div><b>Get Premium · ₹${S.cfg.plans[0].price} se shuru</b><small>Bot Work, more tasks, faster withdraw, 0% fee</small></div><span class="go">View</span></div>`;
  const hist = S.hist.length ? S.hist.map(h => {
    const k = KIND[h.kind] || ['•', h.kind]; const a = Number(h.amount);
    return `<div class="item"><div class="ico">${k[0]}</div><div class="sp"><b>${k[1]}</b><span class="sub">${when(h.at)}</span></div><span class="${a >= 0 ? 'pos' : 'neg'}">${a >= 0 ? '+' : ''}${fmt(a)}</span></div>`;
  }).join('') : '<div class="empty"><i>📭</i>Abhi koi record nahi. Tasks se kamana shuru karo!</div>';
  $('#view').innerHTML = `${langBox()}${payBanner()}${banner}
  <div class="card hero"><div class="sub">Available balance</div><div class="big">${fmt(m.balance)} <span style="font-size:15px;font-weight:600">coins</span></div><div class="sub">≈ ₹${inr(m.balance)}</div>
  <div class="grid3"><div class="mini"><b>${fmt(m.total_earned)}</b><span>Total earned</span></div><div class="mini"><b>${fmt(m.hold)}</b><span>On hold (${S.cfg.hold_hours}h)</span></div><div class="mini"><b>${fmt(m.ad_balance)}</b><span>Ad balance</span></div></div></div>
  ${deviceWarn()}
  <div class="row" style="margin:16px 0 4px"><h3 class="sp">Recent activity</h3></div><div class="card" style="padding:4px 16px">${hist}</div>`;
}

/* ---------- TASKS ---------- */
function rTasks() {
  const T = S.tasks || { channels: [], botworks: [], mine: [] };
  let h = '<h2>Tasks</h2>' + deviceWarn();
  h += `<div class="card" data-act="studio" style="cursor:pointer"><div class="row"><div class="ico">➕</div><div class="sp"><b>Add Task / My posts</b><span class="sub">Apna channel ya bot promote karo</span></div><span class="chip g">Open</span></div></div>`;
  if (S.blocked.length) {
    h += `<div class="card badbox"><b>🚫 Tasks blocked</b><p style="margin:4px 0 10px">Tumne channel leave kiya. In sabko dobara join karo:</p>${S.blocked.map(b => `<div class="item"><div class="ico">📣</div><div class="sp"><b>${esc(b.title)}</b></div><button class="btn sm ghost" data-act="open" data-url="${esc(b.link)}">Join</button></div>`).join('')}<button class="btn" style="margin-top:10px" data-act="rejoin">Re-check</button></div>`;
  }

function compress(file) {
  return new Promise((res, rej) => {
    const img = new Image(), u = URL.createObjectURL(file);
    img.onload = () => {
      const k = Math.min(1, 1400 / Math.max(img.width, img.height)), c = document.createElement('canvas');
      c.width = Math.round(img.width * k); c.height = Math.round(img.height * k);
      c.getContext('2d').drawImage(img, 0, 0, c.width, c.height);
      c.toBlob(b => { URL.revokeObjectURL(u); b ? res(b) : rej(); }, 'image/jpeg', 0.82);
    };
    img.onerror = () => rej(); img.src = u;
  });
}

/* ---- photo zoom (pinch, drag, double-tap) ---- */
const Z = { s: 1, x: 0, y: 0, pts: {}, d0: 0, s0: 1, last: 0, mx: 0, my: 0 };
function zApply() { const i = $('#zoom img'); i.style.transform = `translate(calc(-50% + ${Z.x}px), calc(-50% + ${Z.y}px)) scale(${Z.s})`; }
function zOpen(src) { const z = $('#zoom'); Z.s = 1; Z.x = 0; Z.y = 0; Z.pts = {}; z.querySelector('img').src = src; zApply(); z.classList.add('open'); }
function zClose() { $('#zoom').classList.remove('open'); $('#zoom img').removeAttribute('src'); }
function zClamp() { if (Z.s <= 1) { Z.s = 1; Z.x = 0; Z.y = 0; } else { const i = $('#zoom img'), mx = Math.max(0, (i.clientWidth * Z.s - innerWidth) / 2), my = Math.max(0, (i.clientHeight * Z.s - innerHeight) / 2); Z.x = Math.max(-mx, Math.min(mx, Z.x)); Z.y = Math.max(-my, Math.min(my, Z.y)); } }
(() => {
  const z = $('#zoom'), dist = () => { const p = Object.values(Z.pts); return Math.hypot(p[0].x - p[1].x, p[0].y - p[1].y); };
  z.addEventListener('pointerdown', e => {
    if (e.target.closest('.zx')) return;
    z.setPointerCapture(e.pointerId); Z.pts[e.pointerId] = { x: e.clientX, y: e.clientY };
    if (Object.keys(Z.pts).length === 2) { Z.d0 = dist(); Z.s0 = Z.s; }
    else { const t = Date.now(); if (t - Z.last < 300) { Z.s = Z.s > 1 ? 1 : 2.6; zClamp(); zApply(); Z.last = 0; } else Z.last = t; }
  });
  z.addEventListener('pointermove', e => {
    const p = Z.pts[e.pointerId]; if (!p) return;
    const n = Object.keys(Z.pts).length;
    if (n === 2) { p.x = e.clientX; p.y = e.clientY; Z.s = Math.max(1, Math.min(6, Z.s0 * dist() / Z.d0)); }
    else if (Z.s > 1) { Z.x += e.clientX - p.x; Z.y += e.clientY - p.y; p.x = e.clientX; p.y = e.clientY; }
    zClamp(); zApply();
  });
  const up = e => { delete Z.pts[e.pointerId]; };
  z.addEventListener('pointerup', up); z.addEventListener('pointercancel', up);
  z.addEventListener('wheel', e => { e.preventDefault(); Z.s = Math.max(1, Math.min(6, Z.s * (e.deltaY < 0 ? 1.15 : 0.87))); zClamp(); zApply(); }, { passive: false });
})();

const Rec = { mr: null, chunks: [], t0: 0, tm: null, stream: null };

  try { Rec.mr = new MediaRecorder(Rec.stream, Object.assign({ audioBitsPerSecond: 24000 }, mt ? { mimeType: mt } : {})); }
